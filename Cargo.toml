[package]
name = "l2"
version = "0.4.8"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/veilriven-design/l2"

[lib]
name = "l2"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
nix = { version = "0.29", features = ["process", "user", "sched"] }  # prctl + Uid + sched (for future user ns exploration in hardening roadmap)
thiserror = "2.0"
landlock = "0.4"   # for Landlock LSM sandboxing
libc = "0.2"       # for raw seccomp syscall + constants in strict observer/hardening (minimal, already transitive via nix)

[[bin]]
name = "l2"
path = "src/main.rs"

[[bin]]
name = "l2-core"
path = "host/core.rs"
