name: CI

on:
  push:
    branches: [ main, v0.2.0-development ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Clippy
      run: cargo clippy -- -D warnings
    - name: Format check
      run: cargo fmt -- --check
    - name: Smoke tests (strict policy + Landlock)
      run: |
        cargo build --release --quiet
        export L2_DATA_DIR="$(mktemp -d)"
        echo "Using L2_DATA_DIR=$L2_DATA_DIR"

        # Basic CLI
        ./target/release/l2 --help >/dev/null
        ./target/release/l2 --version >/dev/null || true   # version may not be wired yet

        # Strict policy lifecycle + real Landlock enforcement
        ./target/release/l2 create smoke-sys --policy strict
        ./target/release/l2 list smoke-sys
        ./target/release/l2 put smoke-sys data hello.txt --content 'hello from v0.2.0 strict Landlock'
        ./target/release/l2 get smoke-sys hello.txt | grep -q 'hello from v0.2.0 strict Landlock'

        # Exec under strict (writes inside workspace must succeed; the Landlock rules are active here)
        ./target/release/l2 exec smoke-sys 'echo "strict exec ok"; printf "inside-workspace\n" > inside.txt; cat inside.txt; ls -l'

        # Verify the written file is visible via get
        ./target/release/l2 get smoke-sys inside.txt | grep -q 'inside-workspace'

        ./target/release/l2 destroy smoke-sys

        echo "✅ All v0.2.0 smoke tests passed (including strict + Landlock path)"
